name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Check APK
        shell: bash
        run: |
          echo "=== Generated APK ==="
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p output

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK" \
            output/HyperOS-Notification-Fixer-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Notification-Fixer-release
          path: output/HyperOS-Notification-Fixer-release.apk
          retention-days: 30
