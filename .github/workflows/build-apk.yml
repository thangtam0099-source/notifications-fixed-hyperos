name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Check APK
        run: |
          echo "Release APK:"
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk \
            output/HyperOS-Notification-Fixer-v1.0.0-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Notification-Fixer-v1.0.0-release
          path: output/HyperOS-Notification-Fixer-v1.0.0-release.apk
          retention-days: 30
